<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Se perdió la señal — Cima 103.7 FM</title>
<style>
  :root{--gold:#F5A623;--coral:#E84855;--deep:#1A0A2E;--void:#0A0714;--cream:#FFF8F0;--gray:#9AA0B5;--line:rgba(245,166,35,.14);--line-soft:rgba(255,255,255,.07);--ease-spring:cubic-bezier(.34,1.56,.64,1)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{min-height:100svh;display:grid;place-items:center;background:radial-gradient(60% 60% at 70% 20%,rgba(245,166,35,.09),transparent 60%),radial-gradient(50% 50% at 20% 80%,rgba(232,72,85,.07),transparent 60%),var(--void);color:var(--cream);font-family:'Sora',system-ui,sans-serif;padding:24px;text-align:center}
  .num{font-family:Georgia,serif;font-weight:900;font-size:clamp(96px,22vw,180px);line-height:1;letter-spacing:-.03em;background:linear-gradient(180deg,#FFC24B,#B87400);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:drop-shadow(0 10px 40px rgba(245,166,35,.25))}
  h1{font-family:Georgia,serif;font-weight:900;font-size:clamp(22px,4vw,32px);margin:10px 0 12px}
  p{color:var(--gray);max-width:46ch;margin:0 auto 30px;line-height:1.7}
  .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  a{display:inline-flex;align-items:center;gap:10px;padding:15px 30px;border-radius:999px;font-weight:700;font-size:.95rem;text-decoration:none;transition:transform .25s var(--ease-spring)}
  a:hover{transform:translateY(-2px)}
  .home{background:linear-gradient(135deg,var(--gold),var(--coral));color:#1B0E00;box-shadow:0 8px 32px rgba(245,166,35,.25)}
  .wa{border:1px solid var(--line-soft);color:var(--cream)}
  .wa:hover{border-color:var(--line);color:var(--gold)}
  .mark{width:44px;height:44px;border-radius:14px;margin:0 auto 26px;background:linear-gradient(135deg,var(--gold),var(--coral));display:grid;place-items:center;font-family:Georgia,serif;font-weight:900;color:#1B0E00;font-size:.72rem;box-shadow:0 8px 32px rgba(245,166,35,.25)}
  .sig{margin-top:34px;font-size:.72rem;letter-spacing:.3em;text-transform:uppercase;color:var(--gray);opacity:.7}
</style>
</head>
<body>
  <main>
    <div class="mark">103</div>
    <div class="num">404</div>
    <h1>Se perdió la señal</h1>
    <p>Esta frecuencia no existe — pero La Mundial sigue al aire las 24 horas. Vuelve al estudio o escríbenos directo.</p>
    <div class="actions">
      <a class="home" href="index.html">Volver al estudio</a>
      <a class="wa" href="https://wa.me/17877871600" target="_blank" rel="noopener">WhatsApp de La Mundial</a>
    </div>
    <div class="sig">La Mundial · Cadena Cima 103.7 FM</div>
  </main>
</body>
</html>
